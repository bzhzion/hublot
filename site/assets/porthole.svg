<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Hublot mark: brass ring viewport with rivets and a teal glass pane, catching a single
       diagonal glint. Used as favicon and header brand mark; reads on both light and dark
       backgrounds since the ring itself carries enough contrast on its own. -->
  <defs>
    <radialGradient id="glass" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#3fb7ad" />
      <stop offset="55%" stop-color="#0f6a67" />
      <stop offset="100%" stop-color="#062f30" />
    </radialGradient>
    <linearGradient id="brass" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#f1cf7d" />
      <stop offset="45%" stop-color="#caa03f" />
      <stop offset="100%" stop-color="#8a651f" />
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#brass)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#4a3410" stroke-width="2" opacity="0.5" />
  <circle cx="100" cy="100" r="74" fill="url(#glass)" />
  <circle cx="100" cy="100" r="74" fill="none" stroke="#3a2a0e" stroke-width="3" />

  <!-- Diagonal glint on the glass -->
  <path d="M 54 46 A 78 78 0 0 1 132 42" fill="none" stroke="#eafffb" stroke-width="6"
        stroke-linecap="round" opacity="0.28" />

  <!-- Eight rivets around the brass ring -->
  <g fill="#5f430f">
    <circle cx="100" cy="14" r="6" />
    <circle cx="160" cy="40" r="6" />
    <circle cx="186" cy="100" r="6" />
    <circle cx="160" cy="160" r="6" />
    <circle cx="100" cy="186" r="6" />
    <circle cx="40" cy="160" r="6" />
    <circle cx="14" cy="100" r="6" />
    <circle cx="40" cy="40" r="6" />
  </g>
  <g fill="#f4dda0" opacity="0.55">
    <circle cx="100" cy="12" r="2" />
    <circle cx="158" cy="38" r="2" />
    <circle cx="184" cy="98" r="2" />
    <circle cx="158" cy="158" r="2" />
    <circle cx="100" cy="184" r="2" />
    <circle cx="42" cy="158" r="2" />
    <circle cx="16" cy="98" r="2" />
    <circle cx="42" cy="38" r="2" />
  </g>
</svg>
