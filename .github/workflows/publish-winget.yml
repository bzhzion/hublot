name: Publier sur winget

# Calque sur bzhzion/beammeup/.github/workflows/publish-winget.yml.
#
# Appele par le job `winget` de release-windows.yml a chaque push de tag `v*.*.*`, et
# lancable a la main (option `dry_run` pour generer le manifeste sans ouvrir de PR).
# Automatique depuis le 2026-10-24 : le paquet Breizhzion.Hublot a ete fusionne dans
# microsoft/winget-pkgs ce jour-la (PR #431232), donc `wingetcreate update` a enfin quelque
# chose a mettre a jour. Avant, ce workflow etait manuel et desactive, parce qu'une
# premiere soumission ne peut pas se faire par `update`.
#
# Ce que cela implique : poser un tag ouvre une pull request sur microsoft/winget-pkgs, depot
# tiers revu par des moderateurs. D'ou le controle de la politique de confidentialite en
# premiere etape, qui bloque la publication quand la page a pu devenir fausse.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string
      dry_run:
        description: 'Essai a blanc : genere le manifeste, n''ouvre AUCUNE pull request'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string
      dry_run:
        description: 'Essai a blanc : genere le manifeste, n''ouvre AUCUNE pull request'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  winget:
    name: Mettre a jour le manifest Breizhzion.Hublot
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      # La politique de confidentialite doit decrire ce que le code de CETTE version ecrit sur le
      # disque et ouvre sur le reseau. Un echec ici BLOQUE la publication : il demande une relecture
      # de site/privacy.html, pas un contournement du controle.
      - uses: actions/checkout@v7

      - name: Politique de confidentialite a jour avec le code
        shell: pwsh
        run: |
          python scripts/verifier-ecritures-disque.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verifier la release et la copie versionnee
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          # Un vrai installateur Inno Setup (installer.iss), pas un exe SEA
          # seul ni un zip : embarque hublot.exe + node_modules/playwright-core
          # (playwright-core ne survit pas au bundling SEA, doit voyager a
          # cote), ajoute Hublot au PATH utilisateur, fournit un desinstalleur.
          $tag = "v$($env:VERSION)"
          $asset = (gh release view $tag --repo ${{ github.repository }} --json assets -q '.assets[].name' `
                    | Where-Object { $_ -like '*-setup.exe' } | Select-Object -First 1)
          if (-not $asset) { throw "Aucun installeur trouve dans la release $tag" }
          Write-Host "Tag: $tag / asset: $asset"

          # L'URL donnee a winget est la COPIE VERSIONNEE de dl.breizhzion.com, jamais le nom
          # fixe (ecrase a chaque release, il invaliderait le SHA256 d'un manifeste deja
          # accepte, voir docs/distribution.md du depot admin), et pas non plus l'asset GitHub :
          # c'est l'URL du manifeste fusionne, et en changer d'une version a l'autre changerait
          # l'origine de l'installateur sous les yeux du moderateur.
          #
          # Son empreinte est comparee a celle de l'asset de la release avant de la publier :
          # l'envoi sur R2 est une autre etape d'un autre workflow, et un envoi rate ou en
          # retard donnerait a winget un fichier qui n'est pas celui de la release.
          $url = "https://dl.breizhzion.com/hublot/Hublot-Setup-x64-$($env:VERSION).exe"
          gh release download $tag --repo ${{ github.repository }} --pattern $asset --output github.exe --clobber
          Invoke-WebRequest -Uri $url -OutFile r2.exe
          $h1 = (Get-FileHash github.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash r2.exe -Algorithm SHA256).Hash
          if ($h1 -ne $h2) {
            Write-Host "::error title=Copie versionnee differente::$url ne correspond pas a l'asset $asset de la release $tag (GitHub $h1, dl $h2)."
            exit 1
          }
          Write-Host "Copie versionnee identique a l'asset de la release : $h1"
          "url=$url" >> $env:GITHUB_OUTPUT

      - name: wingetcreate update
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
          VERSION: ${{ inputs.version }}
          INSTALLER_URL: ${{ steps.release.outputs.url }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: pwsh
        run: |
          # Le fork personnel prend du retard sur microsoft/winget-pkgs, depot a tres fort
          # trafic, et wingetcreate echoue alors en affirmant que le fork n'a pas pu etre
          # synchronise. Resynchronisation prealable.
          #
          # BLOQUANT depuis le 2026-09-18, et c'est tout l'interet du changement. En simple
          # avertissement, l'etape enchainait sur un `wingetcreate update` deja condamne,
          # qui echouait une minute plus tard sur un message ne nommant pas la cause : on
          # allait donc chercher la panne du cote du paquet ou du jeton. Un echec ici a une
          # cause probable unique, le fork a diverge de l'amont, et il se repare a la main.
          # Le retenter ne sert a rien.
          try {
            $sync = Invoke-RestMethod -Method Post `
              -Uri "https://api.github.com/repos/painteau/winget-pkgs/merge-upstream" `
              -Headers @{ Authorization = "Bearer $env:WINGET_PAT"; Accept = "application/vnd.github+json" } `
              -Body (@{ branch = "master" } | ConvertTo-Json) `
              -ContentType "application/json"
            Write-Host "fork winget-pkgs synchronise : $($sync.message)"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            Write-Host "::error title=Fork winget-pkgs non synchronise::HTTP $code. Le fork painteau/winget-pkgs ne peut pas etre avance sur master, donc wingetcreate travaillerait sur une base perimee. Cause la plus frequente : le fork a diverge de microsoft/winget-pkgs et doit etre remis a plat a la main, ou supprime et refourche. Detail : $_"
            exit 1
          }

          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"

          if ($env:DRY_RUN -eq 'true') {
            $essai = Join-Path $env:RUNNER_TEMP "winget-essai"
            .\wingetcreate.exe update Breizhzion.Hublot `
              --version $env:VERSION `
              --urls "$env:INSTALLER_URL" `
              --token $env:WINGET_PAT `
              --out $essai
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::wingetcreate update a echoue (rc=$LASTEXITCODE)"; exit 1 }
            Get-ChildItem -Path $essai -Recurse -Filter "*.yaml" | ForEach-Object {
              Write-Host "=== $($_.Name) ==="
              Get-Content $_.FullName
            }
            Write-Host "ESSAI A BLANC : manifeste genere, aucune pull request ouverte."
            exit 0
          }

          .\wingetcreate.exe update Breizhzion.Hublot `
            --version $env:VERSION `
            --urls "$env:INSTALLER_URL" `
            --token $env:WINGET_PAT `
            --submit `
            --no-open
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::wingetcreate update a echoue (rc=$LASTEXITCODE)"; exit 1 }
