name: Publier sur le depot APT

# Squelette calque sur bzhzion/beammeup/.github/workflows/publish-apt.yml.
# NE FONCTIONNE PAS TEL QUEL : les secrets AXOLOTL_APT_KEY / AXOLOTL_HOST /
# AXOLOTL_USER n'existent pas sur ce depot. beammeup utilise une cle SSH
# DEDIEE, restreinte cote serveur par une commande forcee dans
# authorized_keys sur axolotl (limitee a publier un paquet nomme "beammeup",
# sans shell ni lecture de fichiers - voir docs/beammeup.md du repo admin).
# Cette meme discipline devra etre reproduite pour Hublot avant d'activer ce
# workflow : une cle a part, jamais reutiliser celle de beammeup, jamais une
# cle d'acces general a axolotl. Declenchement manuel uniquement, jamais
# automatique.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apt:
    name: Publier le .deb sur apt.breizhzion.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le .deb de la release
        id: deb
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          echo "Tag: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.deb' --dir .
          DEB=$(ls *.deb | head -1)
          echo "Paquet: $DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      # TODO : cle SSH dediee et restreinte non configuree pour Hublot (voir
      # le commentaire en tete de fichier). Cette etape echouera tant que
      # les secrets ci-dessous ne sont pas crees.
      - name: Publier via la cle restreinte
        env:
          SSH_KEY: ${{ secrets.AXOLOTL_APT_KEY_HUBLOT }}
          HOST: ${{ secrets.AXOLOTL_HOST }}
          USER_NAME: ${{ secrets.AXOLOTL_USER }}
          DEB: ${{ steps.deb.outputs.deb }}
        run: |
          echo "$SSH_KEY" > /tmp/apt_key
          chmod 600 /tmp/apt_key
          ssh -i /tmp/apt_key \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$USER_NAME@$HOST" < "$DEB"
          rm -f /tmp/apt_key
          echo "Publie sur https://apt.breizhzion.com (apt install hublot)"
