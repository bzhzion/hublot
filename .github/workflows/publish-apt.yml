name: Publier sur le depot APT

# Workflow SEPARE du build, mais declenche a sa suite.
#
# La separation est gardee volontairement : fichier distinct, droits distincts, et surtout une
# cle SSH dediee qui n'a rien a voir avec les autres secrets du build. Ce qui a change le
# 2026-09-07, c'est le declenchement.
#
# ⚠️ Il etait « manuel uniquement », pour une raison de securite reelle (seul workflow touchant
# une machine de production depuis un depot public), et la consequence etait que **le depot apt
# derivait en silence** : ce paquet y est reste en 0.1.0 pendant que ses releases passaient a
# 1.0.1 puis 1.0.2. C'est le meme motif que winget, l'unique etape manuelle d'une chaine
# automatisee est celle qui ne se fait pas. Et le declenchement manuel ne protegeait pas de
# grand-chose : pousser un tag et lancer un workflow demandent le meme droit d'ecriture, donc il
# evitait les lancements accidentels et pas les malveillants. La vraie protection est ailleurs,
# dans la cle restreinte ci-dessous.
#
# La cle SSH (`AXOLOTL_APT_KEY`) est **dediee et restreinte cote serveur** : une commande forcee
# dans `authorized_keys` la limite a publier un paquet nomme `hublot`, sans shell ni lecture de
# fichiers. C'est ce qui rend acceptable la presence d'une cle vers une machine de production dans
# les secrets d'un depot public. **Ne jamais la remplacer par une cle d'acces general.**
#
# ⚠️ Piege de `workflow_run` : il ne se declenche que si ce fichier est sur la branche par
# defaut, et son contexte est celui de cette branche et non du tag. La version se lit donc dans
# `head_branch` de l'evenement, pas dans `github.ref`.

on:
  # Appele explicitement par release-linux.yml, a la fin de son build.
  #
  # ⚠️ `workflow_run` a ete essaye d'abord et NE TIRE PAS sur ce depot. Trois tentatives,
  # zero run declenche : depuis un tag, depuis une branche, et avec le declencheur en place
  # depuis longtemps sur la branche par defaut. Les noms de workflow correspondaient au
  # caractere pres, le fichier etait bien sur main, et le run amont finissait en succes.
  # La cause n'a pas pu etre etablie de l'exterieur.
  #
  # `workflow_call` ne repose sur aucun evenement a observer : l'appelant nomme l'appele,
  # donc soit le job existe dans le run, soit il n'existe pas. C'est verifiable d'un coup
  # d'oeil, contrairement a un declenchement qui echoue en ne produisant rien.
  #
  # La separation demandee est conservee : fichier distinct, droits distincts, et sa cle
  # SSH dediee reste la seule chose qui touche la production.
  workflow_call:
    inputs:
      version:
        description: 'Version a publier'
        required: true
        type: string
  # Conserve pour rejouer une version precise a la main.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version a publier (ex: 0.2.0), doit deja avoir une Release GitHub'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apt:
    name: Publier le .deb sur apt.breizhzion.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Determiner la version
        id: v
        env:
          SAISIE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # `inputs.version` porte la version dans les DEUX cas, appel explicite comme
          # declenchement manuel, donc il n'y a plus qu'une source a lire.
          V="${SAISIE:-}"
          if [ -z "$V" ]; then echo "::error::version indeterminable"; exit 1; fi
          echo "Version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Recuperer le .deb de la release
        id: deb
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          TAG="v$VERSION"
          echo "Tag: $TAG"
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.deb' --dir .
          DEB=$(ls *.deb | head -1)
          echo "Paquet: $DEB"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      # Une seule connexion, sans scp ni commande distante : la cle est associee a une commande
      # forcee qui lit le paquet sur l'entree standard, verifie que c'est bien un .deb nomme
      # `hublot`, puis le passe a reprepro. Rien d'autre n'est executable avec cette cle.
      - name: Publier via la cle restreinte
        env:
          SSH_KEY: ${{ secrets.AXOLOTL_APT_KEY }}
          HOST: ${{ secrets.AXOLOTL_HOST }}
          USER_NAME: ${{ secrets.AXOLOTL_USER }}
          DEB: ${{ steps.deb.outputs.deb }}
        run: |
          echo "$SSH_KEY" > /tmp/apt_key
          chmod 600 /tmp/apt_key
          ssh -i /tmp/apt_key \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "$USER_NAME@$HOST" < "$DEB"
          rm -f /tmp/apt_key
          echo "Publie sur https://apt.breizhzion.com (apt install hublot)"
