name: Release Windows (SEA)

# Meme declencheur que beammeup/.github/workflows/release-windows.yml : un
# tag vX.Y.Z construit et publie une Release GitHub avec l'executable en
# asset. Packaging via Node.js Single Executable Applications (SEA), pas de
# toolchain Rust/Tauri ici.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a builder (ex: v0.2.0), vide = dernier tag vX.Y.Z'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

# Serialise les executions de ce workflow au lieu de les laisser se croiser.
#
# PREVENTIF ici, et il faut le dire : aujourd'hui chaque execution publie sur le tag de SA
# version, donc une ancienne qui finirait en dernier n'ecrase rien. Le garde-fou est pose
# avant la chose qu'il protege, c'est-a-dire l'alignement en cours qui va ajouter un
# manifeste et un fichier au nom generique partages entre versions.
#
# C'est a ce moment-la que le defaut devient reel, et il a deja frappe ailleurs : sur
# justmakeq le 2026-09-06, beta.102 partie 34 min avant beta.103 a fini 14 min apres elle,
# et a republie la version precedente par-dessus la nouvelle. Un lire-modifier-ecrire sans
# garde fait gagner le dernier qui ecrit, quelle que soit sa version.
#
# `cancel-in-progress: false` est le point important : annuler mettrait fin a une release en
# cours de publication. Mettre en file conserve l'ordre des tags.
concurrency:
  group: release-windows
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # windows-latest (GitHub-hosted), pas un runner self-hosted : ce repo est
    # destine a devenir public, meme raisonnement que beammeup (un runner
    # self-hosted exposerait l'infrastructure a un risque d'execution de code
    # non maitrise sur un repo public).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version depuis le tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ref = $env:INPUT_TAG
          if (-not $ref) { $ref = $env:GITHUB_REF_NAME }
          if ($ref -notlike 'v*.*.*') { $ref = (git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*') }
          $version = $ref.TrimStart('v')
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          # Version patchee a la volee, jamais commitee : le depot ne porte
          # que la version de developpement, le tag fait foi (meme motif que
          # beammeup, voir docs/mobile-app-releases.md du repo admin).
          (Get-Content package.json -Raw) -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`"" | Set-Content package.json -NoNewline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances npm
        run: npm ci

      - name: Build + package (SEA) + métadonnées Windows (rcedit)
        run: npm run package

      # Meme Service Principal partage que beammeup/justmakeq/hae-app (voir
      # docs/azure.md du repo admin, section rg-codesigning) : un seul
      # compte de signature "breizhzion-signing"/"breizhzion-public" reutilise
      # par tous les produits, pas un compte dedie a creer par repo.
      - name: Signer hublot.exe (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: build
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # windows-latest (GitHub-hosted) n'a pas Inno Setup preinstalle,
      # contrairement au runner self-hosted unraid-windows utilise par
      # d'autres projets (justmakeQ) - meme motif que beammeup : un runner
      # self-hosted exposerait l'infra a un risque sur ce repo public.
      - name: Installer Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Construire l'installateur (Inno Setup)
        id: artifact
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          "name=hublot-$env:APP_VERSION-x64-setup.exe" >> $env:GITHUB_OUTPUT

      # Meme pattern que justmakeQ : l'exe embarque dans l'installateur est
      # deja signe (etape ci-dessus), l'installateur lui-meme (produit par
      # ISCC) a besoin de sa propre signature.
      - name: Signer l'installateur (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: build
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` etait faux ici, et faux d'une facon qui ne se voit pas.
          #
          # Sur un push de tag il vaut le tag, donc tout marche. Sur un
          # `workflow_dispatch` depuis la branche par defaut il vaut « main », et
          # `action-gh-release` CREE alors un tag git nomme « main » et y attache la
          # release. C'est arrive : ce depot porte un tag `main` a cote de `v0.1.0`, et sa
          # release courante y est posee, ce qui donne une URL d'installateur
          # `/download/main/...` que winget refuse puisqu'elle n'est pas immuable par
          # version. Le piege est double : le bug ne tire que sur le chemin manuel, qui
          # existe precisement pour rejouer une release, donc il frappe quand on est deja
          # en train de reparer quelque chose.
          #
          # La bonne reponse etait deja dans ce depot : `release-linux.yml` reconstruit le
          # tag depuis la version. Aligne dessus plutot que d'introduire une troisieme
          # facon de nommer un tag.
          tag_name: v${{ steps.version.outputs.version }}
          name: Hublot ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/${{ steps.artifact.outputs.name }}

      # ── Publie sur dl.breizhzion.com (bucket R2 partage breizhzion-releases) ────
      # Domaine de telechargement commun a toutes les applis du parc sauf justmakeq, qui
      # garde le sien. Trois formes d'URL qui ne servent pas a la meme chose :
      #   - le NOM FIXE, ecrase a chaque release : les boutons de site et les curl ;
      #   - la COPIE VERSIONNEE immuable : les gestionnaires de paquets, qui epinglent un
      #     SHA256 par version. Un nom fixe ecrase invalide l'empreinte d'un manifest
      #     winget deja accepte (arrive pour de vrai, microsoft/winget-pkgs#399072) ;
      #   - LATEST.JSON : ce qu'un site lit pour afficher la version sans redeploiement.
      #
      # Via l'API S3 et non `wrangler r2 object`, et ce n'est pas une preference : les
      # permissions R2 par bucket ne valent QUE pour l'API S3, l'API Cloudflare exigeant
      # une permission a l'echelle du compte. Ce depot etant PUBLIC, un jeton capable
      # d'ecrire dans fourbi-photos ou les sauvegardes Portainer n'y a pas sa place. Le
      # jeton employe ici est refuse sur tout autre bucket, verifie avant d'etre distribue.
      - name: Publier l'installateur sur dl.breizhzion.com
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ steps.version.outputs.version }}
          COMPTE: ${{ secrets.R2_ACCOUNT_ID }}
        shell: pwsh
        run: |
          $r2 = "https://$($env:COMPTE).r2.cloudflarestorage.com"
          $src = Get-ChildItem "build/*-x64-setup.exe" | Select-Object -First 1
          Copy-Item $src.FullName "Hublot-Setup-x64.exe"
          foreach ($cle in @("Hublot-Setup-x64.exe", "Hublot-Setup-x64-$($env:VERSION).exe")) {
            aws s3 cp "Hublot-Setup-x64.exe" "s3://breizhzion-releases/hublot/$cle" `
              --endpoint-url $r2 --content-type application/octet-stream
            if ($LASTEXITCODE -ne 0) { throw "envoi de $cle en echec" }
          }
          # Lire-modifier-ecrire du manifeste, protege par le `concurrency` de ce workflow :
          # sans lui, une version plus ancienne finissant en dernier ecraserait la nouvelle.
          aws s3 cp "s3://breizhzion-releases/hublot/latest.json" _ancien.json --endpoint-url $r2 2>$null
          if ($LASTEXITCODE -ne 0) { "{}" | Set-Content _ancien.json }

      - name: Construire latest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: python
        run: |
          import json, os
          base = "https://dl.breizhzion.com/hublot"
          version = os.environ["VERSION"]
          try:
              with open("_ancien.json") as f:
                  existant = json.load(f)
          except Exception:
              existant = {}
          fichiers = existant.get("files", {})
          fichiers["windows_x64"] = {
              "url": f"{base}/Hublot-Setup-x64.exe",
              "versioned_url": f"{base}/Hublot-Setup-x64-{version}.exe",
              "version": version,
          }
          data = {"version": version, "tag": f"v{version}", "files": fichiers}
          with open("latest.json", "w") as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))

      - name: Pousser latest.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          COMPTE: ${{ secrets.R2_ACCOUNT_ID }}
        shell: pwsh
        run: |
          $r2 = "https://$($env:COMPTE).r2.cloudflarestorage.com"
          aws s3 cp latest.json "s3://breizhzion-releases/hublot/latest.json" `
            --endpoint-url $r2 --content-type application/json
          if ($LASTEXITCODE -ne 0) { throw "envoi de latest.json en echec" }
