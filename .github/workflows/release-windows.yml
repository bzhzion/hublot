name: Release Windows (SEA)

# Meme declencheur que beammeup/.github/workflows/release-windows.yml : un
# tag vX.Y.Z construit et publie une Release GitHub avec l'executable en
# asset. Packaging via Node.js Single Executable Applications (SEA), pas de
# toolchain Rust/Tauri ici.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a builder (ex: v0.2.0), vide = dernier tag vX.Y.Z'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    # windows-latest (GitHub-hosted), pas un runner self-hosted : ce repo est
    # destine a devenir public, meme raisonnement que beammeup (un runner
    # self-hosted exposerait l'infrastructure a un risque d'execution de code
    # non maitrise sur un repo public).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version depuis le tag
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ref = $env:INPUT_TAG
          if (-not $ref) { $ref = $env:GITHUB_REF_NAME }
          if ($ref -notlike 'v*.*.*') { $ref = (git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*') }
          $version = $ref.TrimStart('v')
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT
          # Version patchee a la volee, jamais commitee : le depot ne porte
          # que la version de developpement, le tag fait foi (meme motif que
          # beammeup, voir docs/mobile-app-releases.md du repo admin).
          (Get-Content package.json -Raw) -replace '"version": "\d+\.\d+\.\d+"', "`"version`": `"$version`"" | Set-Content package.json -NoNewline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances npm
        run: npm ci

      - name: Build + package (SEA) + métadonnées Windows (rcedit)
        run: npm run package

      # Meme Service Principal partage que beammeup/justmakeq/hae-app (voir
      # docs/azure.md du repo admin, section rg-codesigning) : un seul
      # compte de signature "breizhzion-signing"/"breizhzion-public" reutilise
      # par tous les produits, pas un compte dedie a creer par repo.
      - name: Signer hublot.exe (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: build
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # windows-latest (GitHub-hosted) n'a pas Inno Setup preinstalle,
      # contrairement au runner self-hosted unraid-windows utilise par
      # d'autres projets (justmakeQ) - meme motif que beammeup : un runner
      # self-hosted exposerait l'infra a un risque sur ce repo public.
      - name: Installer Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Construire l'installateur (Inno Setup)
        id: artifact
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          "name=hublot-$env:APP_VERSION-x64-setup.exe" >> $env:GITHUB_OUTPUT

      # Meme pattern que justmakeQ : l'exe embarque dans l'installateur est
      # deja signe (etape ci-dessus), l'installateur lui-meme (produit par
      # ISCC) a besoin de sa propre signature.
      - name: Signer l'installateur (Azure Trusted Signing)
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://weu.codesigning.azure.net/
          signing-account-name: breizhzion-signing
          certificate-profile-name: breizhzion-public
          files-folder: build
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hublot ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            build/${{ steps.artifact.outputs.name }}
