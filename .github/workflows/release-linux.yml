name: Release Linux (SEA + .deb)

# Meme declencheur que release-windows.yml : un tag vX.Y.Z publie les deux
# plateformes dans la meme Release GitHub sans avoir a se souvenir de lancer
# l'un puis l'autre (motif repris de bzhzion/beammeup).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a builder (ex: v0.2.0), vide = dernier tag vX.Y.Z'
        required: false
        default: ''
  push:
    tags: ['v*.*.*']

# Serialise les executions de ce workflow au lieu de les laisser se croiser.
#
# PREVENTIF ici, et il faut le dire : aujourd'hui chaque execution publie sur le tag de SA
# version, donc une ancienne qui finirait en dernier n'ecrase rien. Le garde-fou est pose
# avant la chose qu'il protege, c'est-a-dire l'alignement en cours qui va ajouter un
# manifeste et un fichier au nom generique partages entre versions.
#
# C'est a ce moment-la que le defaut devient reel, et il a deja frappe ailleurs : sur
# justmakeq le 2026-09-06, beta.102 partie 34 min avant beta.103 a fini 14 min apres elle,
# et a republie la version precedente par-dessus la nouvelle. Un lire-modifier-ecrire sans
# garde fait gagner le dernier qui ecrit, quelle que soit sa version.
#
# `cancel-in-progress: false` est le point important : annuler mettrait fin a une release en
# cours de publication. Mettre en file conserve l'ordre des tags.
concurrency:
  group: release-linux
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version depuis le tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          REF="$INPUT_TAG"
          [ -z "$REF" ] && REF="$GITHUB_REF_NAME"
          case "$REF" in
            v*.*.*) ;;
            *) REF=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*') ;;
          esac
          VERSION="${REF#v}"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/\"version\": \"[0-9]*\.[0-9]*\.[0-9]*\"/\"version\": \"$VERSION\"/" package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dependances npm
        run: npm ci

      - name: Build + package (SEA)
        run: npm run package

      - name: Construire le paquet .deb minimal
        id: deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          PKG_DIR="pkgroot"
          rm -rf "$PKG_DIR"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin"
          cp build/hublot "$PKG_DIR/usr/bin/hublot"
          chmod 755 "$PKG_DIR/usr/bin/hublot"
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: hublot
          Version: $VERSION
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: BREIZHZION <contact@breizhzion.com>
          Description: Broker + CLI pour piloter un Chromium visible partage entre agents
           Hublot expose un unique navigateur Chromium visible via un broker local et un
           CLI, chaque agent operant dans son propre onglet identifie par un label.
          EOF
          DEB_NAME="hublot_${VERSION}_amd64.deb"
          dpkg-deb --build --root-owner-group "$PKG_DIR" "$DEB_NAME"
          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"

      # La publication sur apt.breizhzion.com est faite par publish-apt.yml
      # (declenchement manuel uniquement), via une cle SSH dediee restreinte cote
      # serveur par une commande forcee limitee a un paquet nomme « hublot ».
      #
      # Ce bloc portait jusqu'au 2026-09-07 un TODO annoncant que cet acces
      # n'existait pas encore. Il etait perime depuis le 2026-08-27 : le workflow
      # existe, la cle est posee, et apt.breizhzion.com sert bien hublot. Un TODO
      # qui survit a sa realisation se lit comme un travail restant.

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            ${{ steps.deb.outputs.deb_name }}
